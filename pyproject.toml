[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "software-defect-prediction"
version = "0.1.0"
description = "Pre-registered Camel cross-version defect prediction study"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "imbalanced-learn==0.14.0",
  "matplotlib==3.10.7",
  "metaheuristics-lab @ git+https://github.com/Ehsan-Rezaeii/metaheuristics-lab.git@6b4ef0fa3d72f608146f3dd7eabb84bf39fa896e",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==7.0.0", "ruff==0.14.4", "build==1.3.0"]
[project.scripts]
sdp = "software_defect_prediction.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
[tool.ruff.format]
docstring-code-format = true
